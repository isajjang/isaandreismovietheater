<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isa & Rei | Arcane Booster</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--gold:#f5d99a;--violet:#bb65ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080410;color:#fff;overflow-x:hidden;font-family:Rajdhani,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 52%,#48206e 0%,#160b2b 38%,#06030e 82%),repeating-linear-gradient(90deg,transparent 0 8%,#c369ff15 8.2% 8.4%);z-index:-3}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 60%,transparent 0 28%,#02010899 100%);z-index:5}#fx{position:fixed;inset:0;pointer-events:none;z-index:4}main{position:relative;z-index:6;max-width:1200px;margin:auto;padding:26px 16px 50px;text-align:center}.eyebrow{color:#cf9cfc;letter-spacing:.5em;font-weight:700;font-size:13px}.title{font-family:Cinzel,Georgia,serif;font-size:clamp(28px,4.4vw,57px);line-height:1.16;margin:8px 0 3px;color:var(--gold);text-shadow:0 2px 0 #743765,0 0 25px #b83bfcaa;letter-spacing:.05em}.subtitle{letter-spacing:.28em;font-size:clamp(11px,1.4vw,16px);color:#d8b6ed;margin:8px 0}.stage{position:relative;min-height:min(68vh,650px);display:flex;justify-content:center;align-items:center;perspective:1400px}.sigil{position:absolute;width:min(65vw,540px);aspect-ratio:1;border-radius:50%;border:2px solid #b86aff44;box-shadow:0 0 50px #b94cff33,inset 0 0 65px #bd51ff33;animation:rotate 28s linear infinite;pointer-events:none}.sigil:before,.sigil:after{content:"";position:absolute;inset:9%;border:1px dashed #ffdb9d66;border-radius:50%}.sigil:after{inset:22%;border:2px solid #b45cff55;box-shadow:0 0 40px #bb57ff55}.runes{position:absolute;font-size:clamp(180px,40vw,480px);color:#d8a5ff12;line-height:1;pointer-events:none;animation:rotate 40s linear infinite reverse}.pack{width:min(285px,65vw);position:relative;z-index:3;cursor:pointer;animation:levitate 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #ac55ff) drop-shadow(0 0 40px #7430ff88);transition:filter .25s}.pack img{width:100%;display:block;border-radius:8px}.pack:hover{filter:drop-shadow(0 0 35px #eac4ff) brightness(1.18)}.pack:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 23%,#ffffff55 46%,transparent 62%);mix-blend-mode:screen;animation:foil 3.8s linear infinite;pointer-events:none}.pack.ripping{animation:tear .95s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}.tearstrip{position:absolute;top:0;left:0;right:0;height:12%;background:linear-gradient(#ffffff77,#ffffff00);clip-path:polygon(0 0,100% 0,100% 55%,80% 75%,55% 43%,35% 90%,0 60%);opacity:0}.pack.ripping .tearstrip{opacity:1;animation:strip .75s ease-out forwards}.cards{position:absolute;display:flex;gap:clamp(7px,2vw,24px);align-items:center;justify-content:center;opacity:0;pointer-events:none;width:100%;transition:opacity .3s}.cards.visible{opacity:1;pointer-events:auto}.card{width:clamp(96px,26vw,250px);aspect-ratio:1050/1440;position:relative;perspective:1300px;cursor:pointer;opacity:0;transform:translateY(190px) scale(.6);transition:transform .8s cubic-bezier(.17,1.25,.3,1),opacity .65s;--mx:50%;--my:50%;--tiltx:0deg;--tilty:0deg}.cards.visible .card{opacity:1;transform:translateY(0) rotate(var(--angle))}.cards.visible .card:nth-child(2){transition-delay:.16s}.cards.visible .card:nth-child(3){transition-delay:.32s}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1)}.card.revealed .inner{transform:rotateY(180deg) rotateX(var(--tiltx)) rotateY(var(--tilty))}.face{position:absolute;inset:0;border-radius:9px;overflow:hidden;backface-visibility:hidden;box-shadow:0 0 0 2px #c991ff88,0 12px 35px #000b}.front{transform:rotateY(180deg);border:2px solid #e6c1ff}.front img{display:block;width:100%;height:100%;object-fit:fill}.back{border:6px solid #9b531d;background:repeating-radial-gradient(ellipse at 50% 50%,#10070d 0 6px,#e89b38 8px 11px,#210b15 14px 20px,#ac5c22 22px 25px)}.back:after{content:"✧";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(45px,11vw,110px);color:#ffd8a4;text-shadow:0 0 20px #fff}.holo{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:repeating-linear-gradient(118deg,#ff4dba3d 0%,#ffefab4a 9%,#7efff33a 17%,#bd76ff4d 27%,#ff4dba3d 36%),radial-gradient(circle at var(--mx) var(--my),#ffffffaa,transparent 42%);background-size:250% 250%,100% 100%;transition:opacity .4s;animation:holo 5s linear infinite}.card.revealed .holo{opacity:.7}.card.revealed{filter:drop-shadow(0 0 18px #b84aff)}.card.revealed:hover{filter:drop-shadow(0 0 28px #ffb6ff)}.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ffffffed 0,#e2a0ffbb 18%,#9c36ff44 35%,transparent 67%);opacity:0;z-index:8}.glow.burst{animation:burst .95s ease-out}.status{min-height:26px;color:#f7d7a2;letter-spacing:.16em;font-size:15px;font-weight:700;text-transform:uppercase}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px auto}button{font:700 15px Rajdhani,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ffeac7;border:1px solid #d5a6ef;background:linear-gradient(135deg,#5a2086,#220c3d);border-radius:4px;padding:12px 22px;cursor:pointer;box-shadow:inset 0 1px #ffffff40,0 0 16px #a845ff33}button:hover{background:linear-gradient(135deg,#8e36bc,#41135f);box-shadow:0 0 22px #bb66ff77}button:disabled{opacity:.35;cursor:default}.hint{color:#bda1cb;font-size:13px;letter-spacing:.06em}.hide{display:none!important}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes levitate{50%{translate:0 -16px}}@keyframes foil{from{background-position:300px 0}to{background-position:-400px 0}}@keyframes holo{to{background-position:250% 250%,0 0}}@keyframes tear{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-3deg)}55%{transform:scale(1.2) rotate(7deg);filter:brightness(2.5)}100%{transform:scale(1.8) rotate(-13deg);opacity:0;filter:brightness(4)}}@keyframes strip{to{transform:translate(80px,-130px) rotate(35deg);opacity:0}}@keyframes burst{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@media(max-width:650px){.stage{min-height:430px}.sigil{width:90vw}.back{border-width:3px}.title{font-size:clamp(24px,7vw,36px)}.eyebrow{letter-spacing:.25em}}@media(prefers-reduced-motion:reduce){.sigil,.runes,.pack,.holo{animation:none}.inner,.card{transition-duration:.1s}}
</style></head><body><canvas id="fx"></canvas><main><div class="eyebrow">✦ THE ARCANE COLLECTION ✦</div><h1 class="title">ISA & REI'S<br>MOVIE THEATER</h1><div class="subtitle">COLLECTOR BOOSTER EXPERIENCE</div><section class="stage"><div class="sigil"></div><div class="runes">✧</div><div class="glow" id="glow"></div><div id="pack" class="pack" role="button" tabindex="0" aria-label="Open booster pack"><img src="booster-pack.png" alt="Collector booster pack"><div class="tearstrip"></div></div><div id="cards" class="cards"><div class="card" style="--angle:-8deg" tabindex="0" role="button" aria-label="Reveal Isa"><div class="inner"><div class="face back"></div><div class="face front"><img src="isa.png" alt="Isa spellcaster card"><div class="holo"></div></div></div></div><div class="card" style="--angle:0deg" tabindex="0" role="button" aria-label="Reveal Rei"><div class="inner"><div class="face back"></div><div class="face front"><img src="rei.png" alt="Rei spellcaster card"><div class="holo"></div></div></div></div><div class="card" style="--angle:8deg" tabindex="0" role="button" aria-label="Reveal Athena"><div class="inner"><div class="face back"></div><div class="face front"><img src="athena.png" alt="Athena spellcaster card"><div class="holo"></div></div></div></div></div></section><div class="status" id="status" aria-live="polite">✦ Click the pack to break the seal ✦</div><div class="buttons"><button id="reveal" disabled>✦ Reveal All</button><button id="reset">↻ Open Again</button><button id="sound" aria-pressed="true">♫ Sound On</button></div><div class="hint">Move your cursor across revealed cards to see the holographic foil</div></main><script>
const pack=document.getElementById('pack'),cards=document.getElementById('cards'),glow=document.getElementById('glow'),status=document.getElementById('status'),reveal=document.getElementById('reveal'),soundBtn=document.getElementById('sound'),cardEls=[...document.querySelectorAll('.card')];let opened=false,busy=false,soundOn=true,audio=null;
function context(){if(!soundOn)return null;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}
// Soft, original arcane soundscape: tuned glass bells, low atmospheric drone, and gentle shimmer.
function tone(f,d=.7,type='sine',vol=.045,delay=0){let a=context();if(!a)return;let t=a.currentTime+delay;let o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(f,t);lp.type='lowpass';lp.frequency.value=2600;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(Math.min(vol,.055),t+.045);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.25,d));o.connect(lp).connect(g).connect(a.destination);o.start(t);o.stop(t+Math.max(.25,d)+.05);
// quiet upper harmonic gives the note a crystal-bell timbre
let h=a.createOscillator(),hg=a.createGain();h.type='sine';h.frequency.value=f*2.01;hg.gain.setValueAtTime(0,t);hg.gain.linearRampToValueAtTime(Math.min(vol*.19,.009),t+.02);hg.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.25,d)*.72);h.connect(hg).connect(a.destination);h.start(t);h.stop(t+Math.max(.25,d)+.05)}
function noise(d=.8,vol=.012){let a=context();if(!a)return;let len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),data=b.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;let s=a.createBufferSource(),g=a.createGain(),filter=a.createBiquadFilter();filter.type='lowpass';filter.frequency.value=650;s.buffer=b;let t=a.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(Math.min(vol,.014),t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(filter).connect(g).connect(a.destination);s.start(t);s.stop(t+d)}
function openSound(){noise(1.8,.009);tone(110,2.5,'sine',.025);[261.63,392,523.25,783.99,1046.5].forEach((f,i)=>tone(f,2.3,'sine',.042,.16+i*.2))}
function flipSound(){[523.25,783.99,1174.66].forEach((f,i)=>tone(f,1.5,'sine',.038,i*.115))}
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let particles=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function burst(x,y,count=100){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=1.5+Math.random()*10;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:50+Math.random()*40,max:90,size:1+Math.random()*4,hue:[280,305,45,190][Math.floor(Math.random()*4)]})}}function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.04;p.life--;ctx.globalAlpha=Math.min(1,p.life/35);ctx.fillStyle=`hsl(${p.hue} 100% 78%)`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(tick)}tick();function center(el){let r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function openPack(){if(opened||busy)return;busy=true;openSound();pack.classList.add('ripping');glow.classList.add('burst');let [x,y]=center(pack);burst(x,y,190);status.textContent='✦ The seal is broken ✦';setTimeout(()=>{pack.classList.add('hide');cards.classList.add('visible');opened=true;busy=false;reveal.disabled=false;status.textContent='✦ Choose a card to reveal ✦';cardEls.forEach((c,i)=>setTimeout(()=>{let [x,y]=center(c);burst(x,y,35);tone(392*Math.pow(2,i/6),1.2,'sine',.026)},i*180))},950)}
function flip(c){if(!opened||c.classList.contains('revealed'))return;c.classList.add('revealed');flipSound();let [x,y]=center(c);burst(x,y,95);let n=cardEls.filter(c=>c.classList.contains('revealed')).length;status.textContent=n===3?'✦ THE COLLECTION IS REVEALED ✦':`✦ ${n} OF 3 CARDS REVEALED ✦`;if(n===3){setTimeout(()=>{let [x,y]=center(cards);burst(x,y,150);[523,659,784,1046].forEach((f,i)=>tone(f,.7,'sine',.05,i*.12))},550)}}
pack.addEventListener('click',openPack);pack.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();openPack()}});cardEls.forEach(c=>{c.addEventListener('click',()=>flip(c));c.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();flip(c)}});c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',`${x*100}%`);c.style.setProperty('--my',`${y*100}%`);c.style.setProperty('--tiltx',`${(0.5-y)*9}deg`);c.style.setProperty('--tilty',`${(x-.5)*9}deg`)});c.addEventListener('pointerleave',()=>{c.style.setProperty('--tiltx','0deg');c.style.setProperty('--tilty','0deg')})});reveal.addEventListener('click',()=>cardEls.forEach((c,i)=>setTimeout(()=>flip(c),i*650)));document.getElementById('reset').addEventListener('click',()=>{opened=false;busy=false;cards.classList.remove('visible');cardEls.forEach(c=>c.classList.remove('revealed'));pack.classList.remove('ripping','hide');glow.classList.remove('burst');reveal.disabled=true;status.textContent='✦ Click the pack to break the seal ✦';tone(392,1.3,'sine',.025)});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♫ Sound On':'♫ Sound Off';soundBtn.setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(659.25,1,'sine',.025)});
</script></body></html>
